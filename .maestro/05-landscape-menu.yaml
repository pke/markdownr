# Regression test for the landscape fixes:
#   - the FAB menu items used to render above the top screen edge (unreachable)
#     on short landscape screens; they must now stay on-screen (scrollable).
# Requires a Maestro version that supports `setOrientation`.
appId: dev.dudesoft.markdownr.dev
---
- stopApp
- launchApp:
    clearState: true
- waitForAnimationToEnd
- waitForAnimationToEnd
- setOrientation: LANDSCAPE_LEFT
- waitForAnimationToEnd
- tapOn:
    id: "mainMenuButton"
- waitForAnimationToEnd
- waitForAnimationToEnd
# The regression signal: "Default" (theme cycler) and "Auto" (dark mode) are the
# TOP items — they used to render above the screen edge in landscape and be
# unreachable. Their visibility is what actually proves the scrollable-stack fix.
# ("Search"/"Open Folder" sit nearest the FAB and stayed visible even when broken.)
- assertVisible: "Default"
- assertVisible: "Auto"
- assertVisible: "Search"          # bottom of the stack — sanity that the whole menu is present
- takeScreenshot: 05-landscape-menu
- setOrientation: PORTRAIT
