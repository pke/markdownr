# Recent files: list and Clear All.
# Fastlane seeds real files (Alpha, Beta, Gamma). For the development build,
# use recents-setup.sh. Keep app data so fixtures survive the launch.
appId: '${typeof MARKDOWNR_APP_ID === "undefined" ? "dev.dudesoft.markdownr.dev" : MARKDOWNR_APP_ID}'
---
- stopApp
- launchApp:
    clearState: false
- waitForAnimationToEnd
- waitForAnimationToEnd
# Open the drawer via edge swipe; the Recent Files section lists the seeded files.
- swipe:
    start: "2%, 50%"
    end: "85%, 50%"
- waitForAnimationToEnd
- waitForAnimationToEnd
- assertVisible: "Recent Files"
# Recent items combine icon+title+subtitle into one accessibility label, so match
# with a wildcard rather than the bare title.
- extendedWaitUntil:
    visible: ".*Gamma.*"
    timeout: 10000
- takeScreenshot: 09-recents-drawer
# Open the full list from the drawer.
- tapOn: "Manage"
- waitForAnimationToEnd
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ".*Alpha.*"
    timeout: 10000
- takeScreenshot: 09-recents-list
# This flow verifies Clear All. RecentsUITests covers the per-row swipe.
- tapOn: "Clear All"
- waitForAnimationToEnd
- waitForAnimationToEnd
- assertVisible: ".*No recent files.*"
- takeScreenshot: 09-recents-cleared
