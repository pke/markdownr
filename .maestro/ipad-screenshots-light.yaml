    id: "cycleThemeButton"
- tapOn:
    id: "cycleThemeButton"
- tapOn:
    id: "cycleThemeButton"
- tapOn:
    id: "cycleThemeButton"
- tapOn:
    id: "cycleThemeButton"
- waitForAnimationToEnd

# Close menu
- tapOn:
    id: "mainMenuButton"
- waitForAnimationToEnd
- waitForAnimationToEnd

