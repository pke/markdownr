# Set to light mode via in-app toggle, then relaunch for clean XCTest session
- launchApp:
    clearState: true
- waitForAnimationToEnd
- waitForAnimationToEnd
- tapOn:
    id: "mainMenuButton"
- waitForAnimationToEnd
- tapOn:
    id: "darkModeButton"
- waitForAnimationToEnd
- waitForAnimationToEnd

# Relaunch to get a clean XCTest session — settings are persisted
- stopApp
- launchApp
- waitForAnimationToEnd
- waitForAnimationToEnd
- waitForAnimationToEnd

