# Verify that a swipe opens the Table of Contents drawer for the welcome document.
appId: '${typeof MARKDOWNR_APP_ID === "undefined" ? "dev.dudesoft.markdownr.dev" : MARKDOWNR_APP_ID}'
---
- stopApp
- launchApp:
    clearState: true
- setOrientation: PORTRAIT
- waitForAnimationToEnd
- waitForAnimationToEnd
- assertVisible: "Welcome to Markdownr"
- runFlow:
    when:
      platform: Android
    commands:
      - assertNotVisible: "^Contents$"
      - swipe:
          start: "18%, 50%"
          end: "85%, 50%"
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: "2%, 50%"
          end: "85%, 50%"
- waitForAnimationToEnd
- assertVisible: "Contents"        # drawer section heading
- assertVisible: "About"           # drawer footer link
- takeScreenshot: 02-toc-drawer
