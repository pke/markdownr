[package]
name = "markdownr"
version = "0.1.0"
edition = "2024"

[dependencies]
pulldown-cmark = { version = "0.13.6", default-features = false }
ttf-parser = { version = "0.25.1", default-features = false, features = ["std", "opentype-layout"] }

[target.'cfg(windows)'.dependencies]
windows-numerics = "0.3"
windows-core = "0.62"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Ole", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Controls", "Win32_Storage_Xps", "Foundation_Numerics", "Win32_Graphics_Imaging", "Win32_System_Com_Urlmon", "Win32_UI_Input_Touch", "Win32_UI_Controls_Dialogs", "Win32_Storage_FileSystem", "Win32_Graphics_Direct2D_Common", "Win32_System_Com_StructuredStorage", "Win32_System_SystemInformation", "Win32_Globalization"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[patch.crates-io]
pulldown-cmark = { path = "vendor/pulldown-cmark" }
